<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>商品查詢器 v5.8</title>
    <!-- 引入條碼掃描套件 -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --poya: #d63384; --border: #eee; --bg-memo: #fffde7; }
        body { font-family: "微軟正黑體", sans-serif; background: #fff; margin: 0; padding: 0; }
        .sticky-header { position: sticky; top: 0; background: #fff; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .search-box { display: flex; padding: 8px; gap: 6px; }
        input { flex: 1; padding: 10px; font-size: 17px; border: 1px solid #ccc; border-radius: 4px; outline: none; min-width: 0; }
        .btn-main { padding: 0 15px; background: var(--poya); color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; white-space: nowrap; font-size: 16px; }
        .btn-scan { padding: 0 13px; background: var(--poya); color: white; border: none; border-radius: 4px; font-size: 19px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .nav-row { display: flex; background: #fff; border-bottom: 2px solid var(--poya); }
        .nav-btn { flex: 1; padding: 12px 0; font-size: 15px; color: #666; border: none; background: none; font-weight: bold; cursor: pointer; text-align: center; }
        .nav-btn.active { color: var(--poya); background: #fdf2f7; }
        .sort-row { display: flex; background: var(--poya); padding: 5px 0; }
        .sort-btn { flex: 1; padding: 6px 0; font-size: 13px; color: white; border: none; background: none; font-weight: bold; }
        .item-row { padding: 12px 15px; border-bottom: 1px solid var(--border); position: relative; background: #fff; }
        .item-name { font-size: 16px; font-weight: bold; color: #000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; margin-bottom: 4px; width: 80%; }
        .meta-line { font-size: 14px; color: #666; font-family: monospace; display: flex; gap: 15px; align-items: center; }
        .memo-row { padding: 12px 10px; border-bottom: 1px solid var(--border); background: #fff; position: relative; }
        .memo-top { display: flex; align-items: center; margin-bottom: 6px; }
        .qty-box { display: flex; align-items: center; margin-right: 12px; }
        .qty-btn { width: 30px; height: 30px; border: 1px solid #ddd; border-radius: 4px; color: var(--poya); font-weight: bold; cursor: pointer; text-align: center; line-height: 28px; background:#fff; }
        .qty-num { width: 35px; text-align: center; font-size: 18px; font-weight: bold; }
        .memo-input { width: 100%; margin-top: 8px; padding: 8px; border: 1px solid #ddd; border-radius: 4px; background: var(--bg-memo); font-size: 14px; box-sizing: border-box; resize: vertical; min-height: 40px; }
        .btn-save { position: absolute; right: 15px; top: 12px; background: var(--poya); color: #fff; border: none; padding: 6px 12px; border-radius: 4px; font-size: 12px; }
        .btn-save.done { background: #4caf50; }
        .btn-remove { position: absolute; right: 10px; top: 12px; background: #999; color: white; border: none; padding: 5px 10px; border-radius: 4px; font-size: 12px; cursor: pointer; }
        .highlight { color: var(--poya); background: #fff9c4; font-weight: bold; }
        
        /* 完全相符的國碼背景色 */
        .exact-barcode {
            background-color: var(--poya);
            color: #ffffff !important;
            padding: 2px 7px;
            border-radius: 4px;
            font-weight: bold;
            display: inline-block;
        }

        .status-bar { padding: 5px 10px; font-size: 12px; background: #f8f9fa; border-bottom: 1px solid #eee; text-align: center; color: #666; }
        .hidden { display: none !important; }

        /* 全螢幕相機視窗 */
        #scanner-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            z-index: 99999;
            overflow: hidden;
        }
        #reader { width: 100% !important; height: 100% !important; }
        #reader video { width: 100% !important; height: 100% !important; object-fit: cover !important; }
        .scanner-ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .scan-tip { color: #ffffff; font-size: 16px; margin-bottom: 25px; text-shadow: 0 1px 4px rgba(0,0,0,0.8); }
        .scan-box { width: 260px; height: 260px; position: relative; }
        .corner { position: absolute; width: 26px; height: 26px; border: 4px solid #ffffff; }
        .top-left { top: 0; left: 0; border-right: none; border-bottom: none; border-radius: 6px 0 0 0; }
        .top-right { top: 0; right: 0; border-left: none; border-bottom: none; border-radius: 0 6px 0 0; }
        .bottom-left { bottom: 0; left: 0; border-right: none; border-top: none; border-radius: 0 0 0 6px; }
        .bottom-right { bottom: 0; right: 0; border-left: none; border-top: none; border-radius: 0 0 6px 0; }
        .close-btn {
            position: absolute;
            bottom: 45px;
            pointer-events: auto;
            width: 52px;
            height: 52px;
            background: rgba(35, 35, 35, 0.85);
            color: #ffffff;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.25);
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="sticky-header">
        <div class="search-box">
            <input type="text" id="q" onkeypress="if(event.keyCode==13) doSearch();" placeholder="品名或國碼..">
            <button class="btn-scan" id="btn-scan" title="開啟相機掃條碼">📷</button>
            <button class="btn-main" id="btn-search" onclick="doSearch()">查詢</button>
        </div>
        <div class="nav-row">
            <button id="tab-search" class="nav-btn active" onclick="switchTab('search')">搜尋結果</button>
            <button id="tab-memo" class="nav-btn" onclick="switchTab('memo')">暫存清單 (<span id="memo-count">0</span>)</button>
        </div>
        <div id="ui-search-header">
            <div class="sort-row">
                <button class="sort-btn" onclick="sort(0)">部門 ↕</button>
                <button class="sort-btn" onclick="sort(1)">國碼 ↕</button>
                <button class="sort-btn" onclick="sort(3)">品名 ↕</button>
            </div>
            <div id="status" class="status-bar">檢查快取中...</div>
        </div>
        <div id="ui-memo-header" class="hidden"><div class="status-bar">暫存商品可加減數量與記錄備註</div></div>
    </div>

    <div id="view-search"></div>
    <div id="view-memo" class="hidden"></div>

    <div id="scanner-overlay">
        <div id="reader"></div>
        <div class="scanner-ui">
            <div class="scan-tip">請將條碼對準方框進行掃描</div>
            <div class="scan-box">
                <span class="corner top-left"></span>
                <span class="corner top-right"></span>
                <span class="corner bottom-left"></span>
                <span class="corner bottom-right"></span>
            </div>
            <button class="close-btn" id="btn-close-scanner">✕</button>
        </div>
    </div>

    <script type="text/javascript">
        // ==========================================
        // ★ 核心版本號設定：只要改這裡，手機就會強制更新資料庫！
        // ==========================================
        var DATA_VERSION = "20260919_v5.4.3"; 

        var ALL = [], CUR = [], DIR = [1, 1, 1, 1];
        var MEMO = JSON.parse(localStorage.getItem('poya_v6') || '{}');
        var OLD_GAS_URL = "https://script.google.com/macros/s/AKfycbwPPvJqCN9WFnWCAW6TBWBBZNsQSlUWIouQcx8cR0OxFx_VNhghmBpVAeEs11xy_k22Tg/exec";
        var NEW_GAS_URL = "https://script.google.com/macros/s/AKfycbxa4ScSnIdj3RSWkGLY7w98UUCn5oHQf-Gx0Pp9UO6fDjMlOjWxWt9gUttekXVtc2fHmg/exec";

        // === IndexedDB 本地極速快取 (省流量核心) ===
        function openDB() {
            return new Promise((resolve, reject) => {
                var req = indexedDB.open("PoyaDataDB", 1);
                req.onupgradeneeded = function(e) {
                    var db = e.target.result;
                    if (!db.objectStoreNames.contains("store")) {
                        db.createObjectStore("store");
                    }
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function getCachedData() {
            try {
                var db = await openDB();
                return new Promise((resolve) => {
                    var tx = db.transaction("store", "readonly");
                    var req = tx.objectStore("store").get("goods");
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => resolve(null);
                });
            } catch(e) { return null; }
        }

        async function saveCachedData(data) {
            try {
                var db = await openDB();
                var tx = db.transaction("store", "readwrite");
                tx.objectStore("store").put(data, "goods");
            } catch(e) {}
        }

        // === 網頁啟動：核對版本號 ===
        window.onload = async function() {
            var statusEl = document.getElementById('status');
            var localVersion = localStorage.getItem('poya_version_check');

            // 1. 版本一致：直接從手機資料庫載入，完全不耗網路流量！
            if (localVersion === DATA_VERSION) {
                var cached = await getCachedData();
                if (cached && cached.length > 0) {
                    ALL = cached;
                    statusEl.innerText = "系統就緒 (本機快取 " + DATA_VERSION + ")";
                    updateBadge();
                    return;
                }
            }

            // 2. 版本不同（你修改了上方版本號）或首次載入：強制向 GitHub 下載最新版
            statusEl.innerText = "正在更新資料庫 (" + DATA_VERSION + ")...";
            fetch('data.json?v=' + DATA_VERSION)
                .then(res => res.json())
                .then(async data => {
                    ALL = data;
                    await saveCachedData(data); // 存入手機本機
                    localStorage.setItem('poya_version_check', DATA_VERSION); // 記錄已更新版本
                    statusEl.innerText = "系統就緒 (" + DATA_VERSION + ")";
                    updateBadge();
                })
                .catch(e => {
                    statusEl.innerText = "資料載入失敗，請檢查網路連線";
                });
            updateBadge();
        };

        async function sendLog(q, count) {
            var userIp = "偵測失敗";
            try {
                var response = await fetch('https://api.ipify.org?format=json');
                var data = await response.json();
                userIp = data.ip;
            } catch (e) { console.log("IP API Timeout"); }

            var oldUrl = OLD_GAS_URL + "?q=" + encodeURIComponent(q) + 
                         "&count=" + count + 
                         "&ip=" + userIp + 
                         "&agent=" + encodeURIComponent(navigator.userAgent.substring(0, 50));
            
            var newUrl = NEW_GAS_URL + "?action=record" + 
                         "&type=" + encodeURIComponent("查詢") + 
                         "&content=" + encodeURIComponent("關鍵字: " + q + " | 結果: " + count + " 筆 | IP: " + userIp);

            fetch(oldUrl, { mode: 'no-cors' }).catch(e => console.log("Old log error"));
            fetch(newUrl, { mode: 'no-cors' }).catch(e => console.log("New log error"));
        }

        // 提取系列主幹：保留品牌前綴 (LDH-)，切除最後規格 (-咖F)
        function getBaseSeriesName(name) {
            var str = String(name || '').trim();
            str = str.replace(/[\(（][^\)）]+[\)）]$/, '');
            var lastSepIdx = Math.max(str.lastIndexOf('-'), str.lastIndexOf('/'), str.lastIndexOf('_'));
            if (lastSepIdx > 0 && lastSepIdx > str.length - 7) {
                str = str.substring(0, lastSepIdx);
            }
            str = str.replace(/(金|銀|黑|白|灰|紅|藍|綠|黃|粉|膚|紫|棕|咖|米|奶茶|淺咖|淺膚|灰紫|湖藍|粉桔|深藍|單入|雙入|組|包|S|M|L|XL|XXL|F|加大)$/gi, '');
            return str.trim();
        }

        // 雙向相似度計算
        function getSimilarity(s1, s2) {
            var c1 = String(s1 || '').replace(/[\s\+\-\/\(\)\[\]\._]+/g, '').toLowerCase();
            var c2 = String(s2 || '').replace(/[\s\+\-\/\(\)\[\]\._]+/g, '').toLowerCase();
            if (!c1 || !c2) return 0;
            if (c1 === c2) return 1.0;

            var map = {};
            for (var i = 0; i < c1.length - 1; i++) {
                var pair = c1.substr(i, 2);
                map[pair] = (map[pair] || 0) + 1;
            }

            var intersection = 0;
            for (var j = 0; j < c2.length - 1; j++) {
                var pair = c2.substr(j, 2);
                if (map[pair] && map[pair] > 0) {
                    intersection++;
                    map[pair]--;
                }
            }
            var total = ((c1.length - 1) + (c2.length - 1));
            return total > 0 ? (2.0 * intersection) / total : 0;
        }

        function calculateSmartRank(userInput, r) {
            var query = userInput.trim().toLowerCase();
            var itemName = String(r[3] || '').toLowerCase();
            var barcode = String(r[1] || '').trim().toLowerCase();

            if (barcode.includes(query)) return 10000;

            var cleanName = itemName.replace(/[\s\+\-\/\(\)]+/g, '');
            var segments = query.match(/[\u4E00-\u9FA5]+|[a-z0-9]+/g);
            if (!segments) return 0;

            var totalScore = 0, isStrictFail = false, hasLongEnglishMatched = false;
            var matchedChars = 0, totalDist = 0, lastIdx = -1;

            segments.forEach(seg => {
                var isEngNum = /^[a-z0-9]+$/.test(seg);
                var foundIdx = cleanName.indexOf(seg);

                if (isEngNum) {
                    if (foundIdx === -1) {
                        isStrictFail = true;
                    } else {
                        matchedChars += seg.length;
                        if (seg.length >= 4) hasLongEnglishMatched = true;
                        if (lastIdx !== -1) totalDist += Math.abs(foundIdx - lastIdx);
                        lastIdx = foundIdx;
                    }
                } else {
                    if (foundIdx !== -1) {
                        matchedChars += seg.length;
                        if (lastIdx !== -1) totalDist += Math.abs(foundIdx - lastIdx);
                        lastIdx = foundIdx;
                    } else {
                        var charMatch = 0;
                        for (let c of seg) {
                            let cIdx = cleanName.indexOf(c);
                            if (cIdx !== -1) {
                                charMatch++;
                                if (lastIdx !== -1) totalDist += Math.abs(cIdx - lastIdx);
                                lastIdx = cIdx;
                            }
                        }
                        var threshold = hasLongEnglishMatched ? 0.5 : 0.75;
                        if (charMatch / seg.length < threshold) {
                            isStrictFail = true;
                        } else {
                            matchedChars += charMatch;
                        }
                    }
                }
            });

            if (isStrictFail) return 0;
            var compactness = (totalDist > 0) ? (matchedChars / (matchedChars + totalDist)) : 1.0;
            return (matchedChars * 100) * compactness;
        }

        function doSearch() {
            var val = document.getElementById('q').value.trim();
            if(!val) return;
            CUR = [];

            // 判斷 13 或 14 碼國碼
            var isBarcode = /^\d{13,14}$/.test(val);

            if (isBarcode) {
                var exactItem = ALL.find(item => String(item[1]).trim() === val);

                if (exactItem) {
                    var exactEntry = exactItem.slice();
                    exactEntry.push(100000);
                    CUR.push(exactEntry);

                    var baseName = getBaseSeriesName(exactItem[3]);
                    var rawBase = exactItem[3];

                    for (var i = 0; i < ALL.length; i++) {
                        var target = ALL[i];
                        if (String(target[1]).trim() === val) continue;

                        var targetName = target[3];
                        var targetBase = getBaseSeriesName(targetName);

                        var sim = Math.max(
                            getSimilarity(baseName, targetBase),
                            getSimilarity(baseName, targetName),
                            getSimilarity(rawBase, targetName)
                        );

                        var isExactSeries = (baseName.length >= 4 && targetBase.length >= 4 && (targetBase === baseName || targetName.includes(baseName)));

                        // 相似度門檻 75%
                        if (sim >= 0.75 || isExactSeries) {
                            var entry = target.slice();
                            var deptBonus = (target[0] === exactItem[0]) ? 2000 : 0;
                            var score = Math.round(sim * 1000) + deptBonus;
                            entry.push(score);
                            CUR.push(entry);
                        }
                    }
                } else {
                    for (var i = 0; i < ALL.length; i++) {
                        var score = calculateSmartRank(val, ALL[i]);
                        if (score > 0) {
                            var entry = ALL[i].slice();
                            entry.push(score);
                            CUR.push(entry);
                        }
                    }
                }
            } else {
                for (var i = 0; i < ALL.length; i++) {
                    var score = calculateSmartRank(val, ALL[i]);
                    if (score > 0) {
                        var entry = ALL[i].slice();
                        entry.push(score);
                        CUR.push(entry);
                    }
                }
            }

            CUR.sort(function(a, b) { return b[4] - a[4]; });
            renderSearchPage();
            window.scrollTo(0,0);
            sendLog(val, CUR.length); 
        }

        function renderSearchPage() {
            var h = '', val = document.getElementById('q').value.trim();
            var q = val.match(/[\u4E00-\u9FA5]+|[a-z0-9]+/g) || [];
            
            for (var i = 0; i < CUR.length; i++) {
                var r = CUR[i];
                var name = r[3];
                q.forEach(word => { 
                    if(word) {
                        var safeQ = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                        name = name.replace(new RegExp("("+safeQ+")", "gi"), '<span class="highlight">$1</span>'); 
                    }
                });
                
                // 完全命中的國碼加上粉紅色背景
                var isExactBarcode = (String(r[1]).trim() === val);
                var barcodeHtml = isExactBarcode 
                    ? '<span class="exact-barcode">' + r[1] + '</span>' 
                    : '<span>' + r[1] + '</span>';

                var isSaved = MEMO[r[1]] ? 'done' : '';
                h += '<div class="item-row"><span class="item-name">'+name+'</span>';
                h += '<div class="meta-line"><div>'+r[0]+'</div><div>'+barcodeHtml+'</div></div>';
                h += '<button class="btn-save '+isSaved+'" onclick="save('+i+', this)">'+(MEMO[r[1]]?'已存':'暫存')+'</button></div>';
            }
            document.getElementById('view-search').innerHTML = h || '<div style="padding:50px;text-align:center;color:#999;">查無商品或未達相似度門檻</div>';
            document.getElementById('status').innerText = "命中結果: " + CUR.length + " 筆";
        }

        function save(idx, btn) {
            var r = CUR[idx];
            if(!MEMO[r[1]]) {
                MEMO[r[1]] = { d: r[0], g: r[1], s: r[2], n: r[3], note: "", qty: 0 };
                sync();
                btn.innerText = "已存"; btn.classList.add('done');
            }
        }

        function renderMemoPage() {
            var h = '', keys = Object.keys(MEMO);
            if(keys.length === 0) h = '<div style="padding:50px;text-align:center;color:#999;">暫存清單是空的</div>';
            keys.forEach(id => {
                var r = MEMO[id];
                var qty = r.qty !== undefined ? r.qty : 0; 
                var note = r.note || "";
                
                h += '<div class="memo-row"><div class="memo-top">';
                h += '<div class="qty-box"><button class="qty-btn" onclick="changeQty(\''+id+'\',-1)">-</button><div class="qty-num">'+qty+'</div><button class="qty-btn" onclick="changeQty(\''+id+'\',1)">+</button></div>';
                h += '<div style="flex:1;overflow:hidden;"><span class="item-name" style="width:100%">'+r.n+'</span></div></div>';
                h += '<div class="meta-line"><div>'+r.d+'</div><div>'+r.g+'</div></div>';
                h += '<textarea class="memo-input" placeholder="點擊記錄備註..." oninput="updateNote(\''+id+'\', this.value)">'+note+'</textarea>';
                h += '<button class="btn-remove" onclick="remove(\''+id+'\')">移除</button></div>';
            });
            document.getElementById('view-memo').innerHTML = h;
        }

        function changeQty(id, delta) { 
            if(MEMO[id]) { 
                MEMO[id].qty = (MEMO[id].qty !== undefined ? MEMO[id].qty : 0) + delta; 
                sync(); 
                renderMemoPage(); 
            } 
        }
        
        function updateNote(id, txt) { 
            if(MEMO[id]) { 
                MEMO[id].note = txt; 
                localStorage.setItem('poya_v6', JSON.stringify(MEMO)); 
            } 
        }
        
        function remove(id) { 
            if(confirm('確定移除此項商品？')) { 
                delete MEMO[id]; 
                sync(); 
                renderMemoPage(); 
            } 
        }
        
        function sync() { 
            localStorage.setItem('poya_v6', JSON.stringify(MEMO)); 
            updateBadge(); 
        }
        
        function updateBadge() { 
            document.getElementById('memo-count').innerText = Object.keys(MEMO).length; 
        }

        function switchTab(m) {
            document.getElementById('tab-search').classList.toggle('active', m === 'search');
            document.getElementById('tab-memo').classList.toggle('active', m === 'memo');
            document.getElementById('view-search').classList.toggle('hidden', m !== 'search');
            document.getElementById('view-memo').classList.toggle('hidden', m !== 'memo');
            document.getElementById('ui-search-header').classList.toggle('hidden', m !== 'search');
            document.getElementById('ui-memo-header').classList.toggle('hidden', m !== 'memo');
            if(m === 'memo') renderMemoPage();
        }

        function sort(idx) {
            if(CUR.length == 0) return;
            var f = DIR[idx];
            CUR.sort(function(a, b) { 
                var vA = a[idx], vB = b[idx];
                return (isNaN(vA) ? String(vA).localeCompare(String(vB)) : (vA - vB)) * f;
            });
            DIR[idx] *= -1;
            renderSearchPage();
        }

        // 相機控制邏輯
        var html5QrCode = null;

        document.getElementById('btn-scan').addEventListener('click', function() {
            var overlay = document.getElementById('scanner-overlay');
            overlay.style.display = 'block';

            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }

            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 15, qrbox: { width: 260, height: 260 } },
                function(decodedText) {
                    var cleanCode = decodedText.trim();
                    document.getElementById('q').value = cleanCode;
                    closeScanner();
                    doSearch();
                },
                function(errorMessage) {}
            ).catch(function(err) {
                alert("相機開啟失敗，請確認已授權瀏覽器使用相機：" + err);
                closeScanner();
            });
        });

        document.getElementById('btn-close-scanner').addEventListener('click', closeScanner);

        function closeScanner() {
            var overlay = document.getElementById('scanner-overlay');
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(function() {
                    overlay.style.display = 'none';
                }).catch(function() {
                    overlay.style.display = 'none';
                });
            } else {
                overlay.style.display = 'none';
            }
        }
    </script>
</body>
</html>
